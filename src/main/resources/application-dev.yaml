spring:
  datasource:
    url: jdbc:h2:file:./data/hcnstoredb;MODE=PostgreSQL;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  messages:
    basename: i18n/validation/messages, i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: true
  config:
    import:
      optional:file:.env[.properties]
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}
  upload_url: https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload
  project: ${CLOUDINARY_PROJECT}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time:
      access: 20000
      refresh: 60000

sms:
  vonage:
    api-key: ${VONAGE_API_KEY}
    api-secret: ${VONAGE_API_SECRET}