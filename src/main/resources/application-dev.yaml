spring:
  datasource:
    url: jdbc:h2:file:./data/hcnstoredb;MODE=PostgreSQL;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  messages:
    basename: i18n/validation/messages, i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs